[package]
name = "transparent"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = ["hybrid"]
system-fonts = ["strake-dom/system-fonts"]
vello = ["dioxus-native/vello"]
cpu = ["cpu-pixels"]
svg = ["strake-paint/svg"]
hybrid = ["dioxus-native/vello-hybrid"]
cpu-pixels = ["dioxus-native/vello-cpu-pixels"]
cpu-softbuffer = ["dioxus-native/vello-cpu-softbuffer"]
skia = ["dioxus-native/skia"]

[dependencies]
dioxus-native = { workspace = true, default-features = false, features = ["prelude", "system-fonts"] }

# Control whether system font support is enabled
strake-dom = { workspace = true, default-features = false }
strake-paint = { workspace = true, default-features = false }
strake-traits = { workspace = true }

# Disable unicode URL support
# See https://github.com/hsivonen/idna_adapter
idna_adapter = "=1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.0", features = ["native-activity"] }
