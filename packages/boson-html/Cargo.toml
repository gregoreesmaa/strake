[package]
name = "boson-html"
description = "Boson HTML parser"
documentation = "https://docs.rs/boson-html"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
accessibility = ["boson-dom/accessibility"]
tracing = ["dep:tracing", "boson-dom/tracing"]

[dependencies]
# Boson dependencies
boson-dom = { workspace = true }
boson-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }
