[package]
name = "strake-electron-compat"
description = "Drop-in Electron main-process compatibility: app lifecycle, BrowserWindow, and JSON IPC over Strake primitives"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Same pinned JSON as wpt/runner (already in Cargo.lock): the issue mandates
# JSON-string IPC first, zero-copy later.
serde_json = "1.0.140"
# Slice 2 (issue #82): the shell binding parses pages and hands live
# documents + winit attributes to strake-shell. All workspace-internal and
# already in Cargo.lock: no new external crates.
anyrender = { workspace = true }
strake-dom = { workspace = true }
strake-html = { workspace = true }
strake-shell = { workspace = true }
strake-traits = { workspace = true }
winit = { workspace = true }
