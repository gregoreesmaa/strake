[package]
name = "dioxus-native-dom"
version = "0.7.0"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Core headless native renderer for Dioxus based on boson"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = ["accessibility", "svg", "system-fonts"]

# DOM features
svg = ["boson-dom/svg"]
floats = ["boson-dom/floats"]
accessibility = ["boson-dom/accessibility"]
tracing = ["dep:tracing", "boson-dom/tracing"]
system-fonts = ["boson-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["boson-dom/complex-scripts"]
autofocus = ["boson-dom/autofocus"]

[dependencies]
# Boson dependencies
boson-dom = { workspace = true, default-features = false, features = ["custom-widget"] }
boson-traits = { workspace = true }

# DioxusLabs dependencies
dioxus-core = { workspace = true }
dioxus-html = { workspace = true }

# Windowing & Input
keyboard-types = { workspace = true }


# Other dependencies
tracing = { workspace = true, optional = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true }

[package.metadata.docs.rs]
all-features = true
