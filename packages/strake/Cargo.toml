[package]
name = "strake"
description = "High-level APIs for rendering HTML with Strake"
documentation = "https://docs.rs/strake"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["net", "accessibility", "tracing"]
net = ["dep:tokio", "dep:url", "dep:strake-net"]
accessibility = ["strake-shell/accessibility"]
tracing = ["dep:tracing", "strake-shell/tracing", "strake-html/tracing", "strake-net/tracing"]
scrollbars = ["strake-paint/scrollbars"]

[dependencies]
# Strake dependencies
anyrender_vello = { workspace = true }
strake-traits = { workspace = true }
strake-dom = { workspace = true }
strake-html = { workspace = true }
strake-shell = { workspace = true }
strake-paint = { workspace = true }
strake-net = { workspace = true, optional = true }

# IO & Networking
url = { workspace = true, features = ["serde"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }

tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
