[package]
name = "boson"
description = "High-level APIs for rendering HTML with Boson"
documentation = "https://docs.rs/boson"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["net", "accessibility", "tracing"]
net = ["dep:tokio", "dep:url", "dep:boson-net"]
accessibility = ["boson-shell/accessibility"]
tracing = ["dep:tracing", "boson-shell/tracing", "boson-html/tracing", "boson-net/tracing"]
scrollbars = ["boson-paint/scrollbars"]

[dependencies]
# Boson dependencies
anyrender_vello = { workspace = true }
boson-traits = { workspace = true }
boson-dom = { workspace = true }
boson-html = { workspace = true }
boson-shell = { workspace = true }
boson-paint = { workspace = true }
boson-net = { workspace = true, optional = true }

# IO & Networking
url = { workspace = true, features = ["serde"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }

tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
