[package]
name = "strake-paint"
description = "Paint a Strake Document using anyrender"
documentation = "https://docs.rs/strake-paint"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "strake-dom/svg"]
custom-widget = ["strake-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in strake-dom (off by default while the feature
# matures).
scrollbars = ["strake-dom/scrollbars"]

[dependencies]
# Strake dependencies
anyrender = { workspace = true }
anyrender_svg = { workspace = true, optional = true }
strake-traits = { workspace = true }
strake-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }
euclid = { workspace = true }

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true }
skrifa = { workspace = true }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true, optional = true }

# Other dependencies
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }
