[package]
name = "strake-vibey-script"
description = "JavaScript execution for Strake using the Boa engine"
documentation = "https://docs.rs/strake-vibey-script"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
tracing = ["dep:tracing", "strake-dom/tracing"]

[dependencies]
# Strake dependencies
strake-dom = { workspace = true, features = ["autofocus", "floats"] }
strake-electron-compat = { workspace = true }
strake-html = { workspace = true }
strake-traits = { workspace = true }

# Same pinned JSON as strake-electron-compat: IPC payloads cross the
# main/renderer context boundary as JSON strings.
serde_json = "1.0.140"

# Boa (JavaScript engine)
# `annex-b` enables the Annex B (web-compatibility) ECMAScript features
# (String.prototype.substr, escape/unescape, HTML comments in scripts, ...)
# which all browsers implement and web content relies on
boa_engine = { workspace = true, features = ["annex-b"] }
boa_runtime = { workspace = true }
boa_gc = { workspace = true }

# Servo dependencies
markup5ever = { workspace = true }

# Other dependencies
keyboard-types = { workspace = true }
# OS entropy for `crypto.randomBytes`/`randomUUID` (issue #155,
# user-approved): already transitively in the tree via Boa, so this adds no
# new supply-chain crate.
getrandom = "0.3"
# DEFLATE for `zlib` (issue #155, user-approved blanket): already in the
# tree via other crates. Pure-Rust backend only — no C `libz`.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# HTTP client for `http(s).request` (issue #155, user-approved blanket):
# same crate and TLS backend as `strake-net`, so nothing new in the tree.
reqwest = { workspace = true, features = ["blocking", "native-tls"] }
# File timestamps for `fs.utimes` (issue #155, user-approved blanket):
# already in the tree, so nothing new in the supply chain.
filetime = "0.2"
log = "0.4"
url = { workspace = true }
data-url = { workspace = true }
web-time = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
strake-traits = { workspace = true }
# system-fonts is needed so that text inputs shape real text in tests
# (the selection tests depend on cursor placement within a text layout)
strake-dom = { workspace = true, features = ["system-fonts"] }
keyboard-types = { workspace = true }
url = { workspace = true }
