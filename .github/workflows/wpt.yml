name: WPT

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: "-D warnings"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  WPT_DIR: "./wpt/tests"
  WPT_COMMIT: "5a5b2b591b39c59d5bca77819db305474dcfd18a"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  wpt:
    name: "Run WPT Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: "strake-wpt-linux"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfontconfig1-dev
          version: 1.0
      - name: Clone WPT tests
        run: git clone --depth 1 --revision "$WPT_COMMIT" https://github.com/web-platform-tests/wpt ./wpt/tests
      - name: Build WPT runner
        run: cargo build -rp wpt
      - name: Run WPT tests
        # Issue #73: dom/nodes, dom/events, html/webappapis, and fetch ride
        # the same report-only main-vs-PR diff gate and scorecard as css/svg.
        # Probed locally (timing/boundedness check on a current checkout;
        # per-pin pass rates will differ): 1502 tests, 0 crashes, ~16s wall
        # (rayon-parallel, 10s per-test backstop), so the 15-minute job
        # budget is unaffected. Per-dir baselines live in
        # .github/wpt-baselines.json and the Enforce WPT ratchets step below
        # fails on drops (issue #140).
        run: cargo run -rp wpt css svg dom/nodes dom/events html/webappapis fetch
      - name: Compress report (zstd)
        run: zstd -22 --ultra -o ./wpt/output/wptreport.json.zst ./wpt/output/wptreport.json
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-report.json.zst
          path: ./wpt/output/wptreport.json.zst
          archive: false # Disables zipping. We are already using zstd compression
      - name: Copy files for Github pages
        run: |
          mkdir -p ./sites/gh-pages
          cp ./wpt/output/wptreport.json ./sites/gh-pages/wptreport.json
          cp ./wpt/output/wptreport.json.zst ./sites/gh-pages/wptreport.json.zst
      - name: Install wpt cli
        run: cargo install wpt@0.0.14
      - name: Generate scores.json
        run: |
          wpt calc-scores --in ./sites/gh-pages/wptreport.json --out ./sites/gh-pages/wptscores.json
          zstd -22 --long --ultra -o ./sites/gh-pages/wptscores.json.zst ./sites/gh-pages/wptscores.json
      - name: Fetch main-branch results
        run: |
          if curl -f https://gregoreesmaa.github.io/strake/wptreport.json -o ./wpt/output/main-wptreport.json; then
            echo "WPT_BASELINE=found" >> "$GITHUB_ENV"
          else
            echo "WPT_BASELINE=missing" >> "$GITHUB_ENV"
            echo "::warning::No published main-branch WPT baseline; skipping result diff."
          fi
      - name: Diff WPT results
        if: env.WPT_BASELINE == 'found'
        run: |
          wpt diff ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json | tee ./wpt/output/wptdiff.txt
          wpt diff --format json ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json > ./wpt/output/wptdiff.json
      - name: Enforce WPT ratchets
        # Issue #140: per-dir never-regress gate over the checked-in
        # baselines (.github/wpt-baselines.json, recorded from a green main
        # report; /wpt/*.json is gitignored, so baselines live with the CI
        # config). Fails when any covered dir's passing tests or subtests
        # drop past tolerance; improvements print a raise-the-baselines
        # hint and never fail. Tolerance absorbs runner flakes (TIMEOUTs
        # exist at baseline); lower it as hermeticity improves. The
        # per-dir table below doubles as the scorecard (feeds #23).
        # Regenerate baselines on green main with:
        #   python3 .github/scripts/wpt_ratchet.py update <wptreport.json> .github/wpt-baselines.json
        # (a WPT pin bump always needs a baselines refresh in the same PR).
        run: |
          set +e
          python3 ./.github/scripts/wpt_ratchet.py check ./wpt/output/wptreport.json ./.github/wpt-baselines.json --tolerance 10 | tee ./wpt/output/wpt-ratchet.md
          rc=${PIPESTATUS[0]}
          cat ./wpt/output/wpt-ratchet.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Render results in step summary
        if: github.event_name == 'pull_request' && env.WPT_BASELINE == 'found'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 ./.github/scripts/wpt_diff_to_pr.py --dry-run ./wpt/output/wptdiff.json
      - name: Upload WPT diff
        if: github.event_name == 'pull_request' && env.WPT_BASELINE == 'found'
        uses: actions/upload-artifact@v7
        with:
          name: wpt-diff
          path: |
            ./wpt/output/wptdiff.txt
            ./wpt/output/wptdiff.json
      - name: Setup Github Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'sites/gh-pages'
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5